<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Firmas y Cargos</title>
    
    <!-- Bibliotecas solicitadas -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: 'Segoe UI', Arial, sans-serif; background: #0f0f0f; color: #e0e0e0; }
        .container { width: 100%; max-width: 900px; margin: 0 auto; padding: 20px; }
        
        h1, h2, h3 { color: #d4af37; margin-bottom: 15px; text-align: center; }
        .card { background: #1a1a1a; border-radius: 12px; padding: 25px; box-shadow: 0 8px 30px rgba(0,0,0,0.6  ); margin-bottom: 20px; }
        
        input, textarea, select { width: 100%; padding: 12px; margin: 10px 0; background: #2a2a2a; border: 1px solid #444; border-radius: 6px; color: #e0e0e0; font-size: 1rem; }
        
        /* Botones Personalizados */
        .buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 15px; }
        button { padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: transform 0.2s; color: white; flex-grow: 1; max-width: 250px; }
        button:hover { transform: translateY(-2px); }
        
        .btn-green { background: #2e7d32; } 
        .btn-yellow { background: #fbc02d; color: #000; } 
        .btn-blue { background: #1565c0; } 
        .btn-red { background: #c62828; } 
        .btn-gray { background: #555; } 

        .hidden { display: none !important; }
        .flex-center { display: flex; justify-content: center; align-items: center; flex-direction: column; }
        
        /* Lista de Cargos */
        .cargo-list { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .cargo-item { background: #222; padding: 15px; border-radius: 8px; cursor: pointer; border-left: 5px solid #555; transition: background 0.2s; }
        .cargo-item:hover { background: #333; }
        .cargo-item.inconcluso { border-left-color: #c62828; }
        .cargo-item.completado { border-left-color: #2e7d32; }
        .cargo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .cargo-date { font-size: 0.85rem; color: #aaa; }
        .cargo-status { font-weight: bold; font-size: 0.9rem; padding: 4px 8px; border-radius: 4px; }
        .status-red { background: rgba(198, 40, 40, 0.2); color: #ef5350; }
        .status-green { background: rgba(46, 125, 50, 0.2); color: #66bb6a; }
        
        /* Firmas y Canvas */
        canvas { border: 2px solid #444; background: #f8f8f8; border-radius: 8px; margin: 10px 0; touch-action: none; width: 100%; max-width: 500px; height: 250px; }
        .signatures-display { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .signature-box { border: 1px solid #444; padding: 15px; border-radius: 8px; text-align: center; width: 250px; background: #222; }
        .signature-box img { max-width: 100%; max-height: 100px; background: white; padding: 5px; border-radius: 4px; margin-top: 10px; }
        .signature-box h4 { color: #aaa; font-size: 0.9rem; margin-bottom: 5px; }
        .signature-box p { color: #d4af37; font-weight: bold; }

        /* Reporte PDF y Vista Previa */
        #report-preview-container { background: white; color: black; padding: 20px; border-radius: 8px; margin-top: 20px; overflow-x: auto; }
        .pdf-page { background: white; color: black; width: 100%; max-width: 210mm; margin: 0 auto; font-family: Arial, sans-serif; }
        .pdf-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 12px; }
        .pdf-table th, .pdf-table td { border: 1px solid #000; padding: 8px; text-align: left; vertical-align: middle; }
        .pdf-table th { background: #f0f0f0; }
        .pdf-sign-img { max-height: 40px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <!-- LOGIN -->
    <div id="login-section" class="card flex-center">
        <h1>Iniciar Sesión</h1>
        <input type="text" id="usuario" placeholder="Usuario">
        <input type="text" id="clave" placeholder="Contraseña">
        <div class="buttons"><button class="btn-blue" onclick="handleLogin()">Entrar</button></div>
        <p id="login-msg" style="color: #ff9800; margin-top: 10px;"></p>
    </div>

    <!-- DASHBOARD PRINCIPAL -->
    <div id="dashboard" class="hidden">
        <div class="card">
            <h2>Hola, <span id="username" style="color:#d4af37;"></span></h2>
            <div class="buttons">
                <button class="btn-green" onclick="showView('create-view')">Nuevo Cargo</button>
                <button class="btn-yellow" onclick="showView('search-view')">Búsqueda</button>
                <button class="btn-blue" onclick="showView('report-view')">Reporte</button>
                <button class="btn-red" onclick="handleLogout()">Cerrar Sesión</button>
            </div>
        </div>
        <div class="card">
            <h3>Mis Cargos Recientes</h3>
            <div id="main-cargo-list" class="cargo-list">Cargando...</div>
        </div>
    </div>

    <!-- VISTA: NUEVO CARGO -->
    <div id="create-view" class="hidden card">
        <h2>Redactar Nuevo Cargo</h2>
        <label>Detalle del Cargo:</label>
        <textarea id="cargo-text" rows="6" placeholder="Escribe el detalle del cargo aquí..."></textarea>
        
        <label>Seleccionar Receptor (Quien debe firmar):</label>
        <select id="receptor-select">
            <option value="">-- Seleccione un usuario --</option>
        </select>

        <div class="flex-center" style="margin-top: 20px;">
            <h3 style="color: #d4af37;">Tu Firma (Creador)</h3>
            <canvas id="canvas-create"></canvas>
            <div class="buttons">
                <button class="btn-gray" onclick="clearCanvas('create')">Limpiar Firma</button>
                <button class="btn-green" onclick="saveNewCargo()">Siguiente (Firmar y Guardar)</button>
                <button class="btn-red" onclick="showView('dashboard')">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- VISTA: BÚSQUEDA -->
    <div id="search-view" class="hidden card">
        <h2>Búsqueda Personalizada</h2>
        <label>Desde:</label> <input type="date" id="search-start">
        <label>Hasta:</label> <input type="date" id="search-end">
        <div class="buttons">
            <button class="btn-yellow" onclick="performSearch()">Buscar</button>
            <button class="btn-gray" onclick="showView('dashboard')">Volver</button>
        </div>
        <div id="search-results" class="cargo-list" style="margin-top: 20px;"></div>
    </div>

    <!-- VISTA: REPORTE -->
    <div id="report-view" class="hidden card">
        <h2>Generar Reporte PDF</h2>
        <label>Desde:</label> <input type="date" id="report-start">
        <label>Hasta:</label> <input type="date" id="report-end">
        <div class="buttons">
            <button class="btn-blue" onclick="previewReport()">Ver Vista Previa</button>
            <button id="btn-download-pdf" class="btn-green hidden" onclick="downloadPDF()">Descargar PDF</button>
            <button id="btn-share-pdf" class="btn-yellow hidden" onclick="sharePDF()">Compartir</button>
            <button class="btn-gray" onclick="showView('dashboard')">Cancelar</button>
        </div>
        <p id="report-msg" style="text-align: center; margin-top: 15px; color: #d4af37;"></p>

        <div id="report-preview-container" class="hidden">
            <div id="pdf-content" class="pdf-page"></div>
        </div>
    </div>

    <!-- VISTA: DETALLE DEL CARGO (Para ver y firmar) -->
    <div id="detail-view" class="hidden card">
        <h2>Detalle del Cargo</h2>
        <div style="background: #222; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <p id="detail-text" style="white-space: pre-wrap;"></p>
        </div>
        
        <div id="detail-signatures" class="signatures-display"></div>
        
        <div id="receptor-sign-zone" class="hidden flex-center" style="margin-top: 20px; border-top: 1px solid #444; padding-top: 20px;">
            <h3 style="color: #d4af37;">Firma del Receptor</h3>
            <canvas id="canvas-receptor"></canvas>
            <div class="buttons">
                <button class="btn-gray" onclick="clearCanvas('receptor')">Limpiar Firma</button>
                <button class="btn-green" onclick="saveReceptorSignature()">Firmar Cargo</button>
            </div>
        </div>

        <div class="buttons" style="margin-top: 20px;">
            <button class="btn-gray" onclick="showView('dashboard')">Volver</button>
            <button id="btn-delete-cargo" class="btn-red hidden" onclick="deleteCargo()">Eliminar Cargo</button>
        </div>
    </div>
</div>
<script>
    const SUPABASE_URL = 'https://esiklpxyectbekxvajnw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzaWtscHh5ZWN0YmVreHZham53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE2OTI1MjEsImV4cCI6MjA3NzI2ODUyMX0.mtQnqUrTmhmN1DQxOAUnGpizhYZobStHDH0cz_XfKGU';
    
    let supabaseClient = null;
    let currentUser = null;
    let currentCargoId = null;

    function getSupabase(  ) {
        if (supabaseClient) return supabaseClient;
        try { 
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); 
            return supabaseClient; 
        } catch (err) { 
            alert("Error inicializando Supabase: " + err.message); 
            return null; 
        }
    }

    window.onload = () => {
        const stored = localStorage.getItem('currentUser');
        if (stored) {
            try { 
                currentUser = JSON.parse(stored); 
                showView('dashboard'); 
            } catch (e) { 
                localStorage.removeItem('currentUser'); 
                showView('login-section'); 
            }
        } else { 
            showView('login-section'); 
        }
    };

    function showView(viewId) {
        const views = ['login-section', 'dashboard', 'create-view', 'search-view', 'report-view', 'detail-view'];
        views.forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById(viewId).classList.remove('hidden');

        if (viewId === 'dashboard') {
            document.getElementById('username').textContent = currentUser.usuario;
            loadMainCargoList();
        } else if (viewId === 'create-view') {
            loadReceptors();
            setTimeout(() => initCanvas('create'), 100);
        } else if (viewId === 'report-view') {
            document.getElementById('report-preview-container').classList.add('hidden');
            document.getElementById('btn-download-pdf').classList.add('hidden');
            document.getElementById('btn-share-pdf').classList.add('hidden');
            document.getElementById('report-msg').textContent = '';
        }
    }

    async function handleLogin() {
        const supabase = getSupabase(); if (!supabase) return;
        const usuario = document.getElementById('usuario').value.trim();
        const clave = document.getElementById('clave').value;
        const msg = document.getElementById('login-msg');
        
        if (!usuario || !clave) { msg.textContent = 'Ingresa usuario y contraseña'; return; }
        msg.textContent = 'Verificando...';
        
        try {
            const { data, error } = await supabase.from('usuarios').select('id, usuario').eq('usuario', usuario).eq('clave', clave).single();
            if (error || !data) { msg.textContent = 'Usuario o contraseña incorrectos.'; return; }
            
            currentUser = data;
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            msg.textContent = '';
            showView('dashboard');
        } catch (err) { 
            msg.textContent = 'Error: ' + err.message; 
        }
    }

    function handleLogout() {
        currentUser = null;
        localStorage.removeItem('currentUser');
        document.getElementById('usuario').value = '';
        document.getElementById('clave').value = '';
        showView('login-section');
    }

    // --- CARGAR LISTA PRINCIPAL ---
    async function loadMainCargoList() {
        const supabase = getSupabase(); if (!supabase) return;
        const listDiv = document.getElementById('main-cargo-list');
        listDiv.innerHTML = 'Cargando...';

        try {
            const { data, error } = await supabase.from('firmas_cargos')
                .select('*')
                .or(`created_by.eq.${currentUser.id},signed_by_receptor.eq.${currentUser.id}`)
                .order('fecha', { ascending: false })
                .limit(20);

            if (error) throw error;
            renderCargoList(data, listDiv);
        } catch (err) {
            listDiv.innerHTML = 'Error al cargar: ' + err.message;
        }
    }

    function renderCargoList(data, container) {
        if (!data || data.length === 0) {
            container.innerHTML = '<p>No hay cargos para mostrar.</p>';
            return;
        }

        container.innerHTML = data.map(cargo => {
            const date = new Date(cargo.fecha).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute:'2-digit' });
            const isCompleted = cargo.estatus === 'completado';
            const statusClass = isCompleted ? 'status-green' : 'status-red';
            const statusText = isCompleted ? 'Cargo Completado' : 'Cargo Inconcluso';
            const itemClass = isCompleted ? 'completado' : 'inconcluso';
            const extract = cargo.item.length > 50 ? cargo.item.substring(0, 50) + '...' : cargo.item;

            return `
                <div class="cargo-item ${itemClass}" onclick="openCargoDetail(${cargo.id})">
                    <div class="cargo-header">
                        <span class="cargo-date">${date}</span>
                        <span class="cargo-status ${statusClass}">${statusText}</span>
                    </div>
                    <p><strong>De:</strong> ${cargo.nombre_recepcion} <strong>Para:</strong> ${cargo.nombre_receptor}</p>
                    <p style="color: #aaa; margin-top: 5px;">${extract}</p>
                </div>
            `;
        }).join('');
    }

    // --- NUEVO CARGO ---
    async function loadReceptors() {
        const supabase = getSupabase(); if (!supabase) return;
        const select = document.getElementById('receptor-select');
        
        try {
            const { data, error } = await supabase.from('usuarios').select('id, usuario').neq('id', currentUser.id).order('usuario');
            if (error) throw error;
            
            select.innerHTML = '<option value="">-- Seleccione un usuario --</option>' + 
                data.map(u => `<option value="${u.id}">${u.usuario}</option>`).join('');
        } catch (err) {
            alert("Error cargando usuarios: " + err.message);
        }
    }

    async function saveNewCargo() {
        try {
            const supabase = getSupabase(); if (!supabase) return;
            const cargoInput = document.getElementById('cargo-text');
            const receptorSelect = document.getElementById('receptor-select');
            const canvas = document.getElementById('canvas-create');

            if (!cargoInput || !receptorSelect || !canvas) { alert("Error en HTML: Faltan IDs."); return; }

            const textoCargo = cargoInput.value.trim();
            const receptorId = receptorSelect.value;
            const receptorName = receptorSelect.options[receptorSelect.selectedIndex]?.text;

            if (!textoCargo) { alert("Ingresa el detalle del cargo."); return; }
            if (!receptorId) { alert("Selecciona un receptor."); return; }
            if (isCanvasBlank(canvas)) { alert("Por favor, firma el cargo."); return; }

            const carpetaGenerada = `CARGO-${Date.now()}`;
            const path = `${carpetaGenerada}/_firma_creador_${Date.now()}.png`;
            const blob = dataURLtoBlob(canvas.toDataURL('image/png'));

            const { error: uploadErr } = await supabase.storage.from('firma_cargos').upload(path, blob, { contentType: 'image/png' });
            if (uploadErr) throw uploadErr;

            const { data: urlData } = supabase.storage.from('firma_cargos').getPublicUrl(path);

            const { error } = await supabase.from('firmas_cargos').insert([{
                carpeta: carpetaGenerada,
                item: textoCargo,
                tipo_documento: 'Cargos de Emergencia',
                created_by: currentUser.id,
                responsable: currentUser.usuario,
                nombre_recepcion: currentUser.usuario,
                signed_by_recepcion: currentUser.id,
                firma_recepcion_url: urlData.publicUrl,
                nombre_receptor: receptorName,
                signed_by_receptor: receptorId,
                estatus: 'inconcluso'
            }]);

            if (error) throw error;

            alert('Cargo creado y firmado exitosamente.');
            cargoInput.value = '';
            clearCanvas('create');
            showView('dashboard');

        } catch (err) {
            alert("Error al guardar: " + err.message);
        }
    }

    // --- DETALLE Y FIRMA DE RECEPTOR ---
    async function openCargoDetail(id) {
        try {
            const supabase = getSupabase(); if (!supabase) return;
            currentCargoId = id;
            
            const { data: cargo, error } = await supabase.from('firmas_cargos').select('*').eq('id', id).single();
            if (error) throw error;

            document.getElementById('detail-text').textContent = cargo.item;
            
            const sigDiv = document.getElementById('detail-signatures');
            sigDiv.innerHTML = `
                <div class="signature-box">
                    <h4>Creador (Recepción)</h4>
                    <p>${cargo.nombre_recepcion}</p>
                    <img src="${cargo.firma_recepcion_url}?t=${Date.now()}" crossorigin="anonymous">
                </div>
                <div class="signature-box">
                    <h4>Receptor</h4>
                    <p>${cargo.nombre_receptor}</p>
                    ${cargo.firma_receptor_url ? `<img src="${cargo.firma_receptor_url}?t=${Date.now()}" crossorigin="anonymous">` : '<span style="color:#ef5350; display:block; margin-top:10px;">Falta Firma</span>'}
                </div>
            `;

            const receptorZone = document.getElementById('receptor-sign-zone');
            const btnDelete = document.getElementById('btn-delete-cargo');
            
            receptorZone.classList.add('hidden');
            btnDelete.classList.add('hidden');

            if (cargo.estatus === 'inconcluso') {
                if (cargo.signed_by_receptor == currentUser.id) {
                    receptorZone.classList.remove('hidden');
                    setTimeout(() => initCanvas('receptor'), 100);
                } else if (cargo.created_by == currentUser.id) {
                    btnDelete.classList.remove('hidden');
                }
            }

            showView('detail-view');
        } catch (err) {
            alert("Error al abrir detalle: " + err.message);
        }
    }

    async function saveReceptorSignature() {
        try {
            const supabase = getSupabase(); if (!supabase) return;
            const canvas = document.getElementById('canvas-receptor');
            
            if (isCanvasBlank(canvas)) { alert("Por favor, firma antes de guardar."); return; }

            const { data: cargo } = await supabase.from('firmas_cargos').select('carpeta').eq('id', currentCargoId).single();
            
            const path = `${cargo.carpeta}/_firma_receptor_${Date.now()}.png`;
            const blob = dataURLtoBlob(canvas.toDataURL('image/png'));

            const { error: uploadErr } = await supabase.storage.from('firma_cargos').upload(path, blob, { contentType: 'image/png' });
            if (uploadErr) throw uploadErr;

            const { data: urlData } = supabase.storage.from('firma_cargos').getPublicUrl(path);

            const { error } = await supabase.from('firmas_cargos').update({
                firma_receptor_url: urlData.publicUrl,
                estatus: 'completado'
            }).eq('id', currentCargoId);

            if (error) throw error;

            alert('Firma guardada. Cargo completado.');
            showView('dashboard');

        } catch (err) {
            alert("Error al firmar: " + err.message);
        }
    }

    async function deleteCargo() {
        if (!confirm("¿Estás seguro de eliminar este cargo? Esta acción no se puede deshacer.")) return;
        try {
            const supabase = getSupabase(); if (!supabase) return;
            const { error } = await supabase.from('firmas_cargos').delete().eq('id', currentCargoId);
            if (error) throw error;
            alert("Cargo eliminado.");
            showView('dashboard');
        } catch (err) {
            alert("Error al eliminar: " + err.message);
        }
    }

    // --- BÚSQUEDA ---
    async function performSearch() {
        try {
            const supabase = getSupabase(); if (!supabase) return;
            const start = document.getElementById('search-start').value;
            const end = document.getElementById('search-end').value;
            const resDiv = document.getElementById('search-results');
            
            resDiv.innerHTML = 'Buscando...';

            let query = supabase.from('firmas_cargos').select('*').or(`created_by.eq.${currentUser.id},signed_by_receptor.eq.${currentUser.id}`).order('fecha', { ascending: false });
            
            if (start) query = query.gte('fecha', start + 'T00:00:00');
            if (end) query = query.lte('fecha', end + 'T23:59:59');

            const { data, error } = await query;
            if (error) throw error;

            renderCargoList(data, resDiv);
        } catch (err) {
            document.getElementById('search-results').innerHTML = 'Error: ' + err.message;
        }
    }

    // --- VISTA PREVIA Y REPORTE PDF ---
    async function previewReport() {
        try {
            const supabase = getSupabase(); if (!supabase) return;
            const start = document.getElementById('report-start').value;
            const end = document.getElementById('report-end').value;
            const msg = document.getElementById('report-msg');
            const previewContainer = document.getElementById('report-preview-container');
            const pdfContent = document.getElementById('pdf-content');
            
            if (!start || !end) { alert("Selecciona ambas fechas."); return; }
            msg.textContent = "Generando vista previa...";

            const { data, error } = await supabase.from('firmas_cargos')
                .select('*')
                .or(`created_by.eq.${currentUser.id},signed_by_receptor.eq.${currentUser.id}`)
                .gte('fecha', start + 'T00:00:00')
                .lte('fecha', end + 'T23:59:59')
                .order('fecha', { ascending: true });

            if (error) throw error;
            if (!data || data.length === 0) { 
                msg.textContent = "No hay datos en esas fechas."; 
                previewContainer.classList.add('hidden');
                document.getElementById('btn-download-pdf').classList.add('hidden');
                document.getElementById('btn-share-pdf').classList.add('hidden');
                return; 
            }

            // Construir el HTML de la vista previa con los nombres encima de las firmas
            pdfContent.innerHTML = `
                <h2 style="text-align:center; color:black; margin-bottom: 10px;">Reporte de Cargos</h2>
                <p style="text-align:center; color:#555; margin-bottom: 5px;">Desde: ${start} Hasta: ${end}</p>
                <p style="text-align:center; color:#555; margin-bottom: 20px;">Usuario: ${currentUser.usuario}</p>
                <table class="pdf-table">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Detalle</th>
                            <th>Estado</th>
                            <th>Firma Creador</th>
                            <th>Firma Receptor</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.map(c => `
                            <tr>
                                <td>${new Date(c.fecha).toLocaleDateString('es-ES')}</td>
                                <td>${c.item.substring(0, 40)}...</td>
                                <td>${c.estatus}</td>
                                <td style="text-align: center;">
                                    <div style="font-size: 10px; font-weight: bold; margin-bottom: 2px;">${c.nombre_recepcion}</div>
                                    <img src="${c.firma_recepcion_url}?t=${Date.now()}" class="pdf-sign-img" crossorigin="anonymous">
                                </td>
                                <td style="text-align: center;">
                                    <div style="font-size: 10px; font-weight: bold; margin-bottom: 2px;">${c.nombre_receptor}</div>
                                    ${c.firma_receptor_url ? `<img src="${c.firma_receptor_url}?t=${Date.now()}" class="pdf-sign-img" crossorigin="anonymous">` : 'Pendiente'}
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            msg.textContent = "Vista previa generada. Revisa abajo.";
            previewContainer.classList.remove('hidden');
            document.getElementById('btn-download-pdf').classList.remove('hidden');
            document.getElementById('btn-share-pdf').classList.remove('hidden');

        } catch (err) {
            document.getElementById('report-msg').textContent = 'Error: ' + err.message;
        }
    }

    function downloadPDF() {
        const msg = document.getElementById('report-msg');
        msg.textContent = "Preparando descarga...";
        
        setTimeout(() => {
            const { jsPDF } = window.jspdf;
            html2canvas(document.getElementById('pdf-content'), { scale: 2, useCORS: true }).then(canvas => {
                const pdf = new jsPDF('p', 'mm', 'a4');
                const imgData = canvas.toDataURL('image/png');
                
                // Configuración de márgenes (15mm)
                const margin = 15;
                const pdfWidth = pdf.internal.pageSize.getWidth() - (margin * 2);
                const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                
                pdf.addImage(imgData, 'PNG', margin, margin, pdfWidth, pdfHeight);
                
                const start = document.getElementById('report-start').value;
                const end = document.getElementById('report-end').value;
                pdf.save(`Reporte_Cargos_${start}_al_${end}.pdf`);
                
                msg.textContent = "PDF descargado con éxito.";
            });
        }, 500);
    }

    // --- COMPARTIR PDF ---
    function sharePDF() {
        const msg = document.getElementById('report-msg');
        msg.textContent = "Preparando archivo para compartir...";
        
        setTimeout(() => {
            const { jsPDF } = window.jspdf;
            html2canvas(document.getElementById('pdf-content'), { scale: 2, useCORS: true }).then(async canvas => {
                const pdf = new jsPDF('p', 'mm', 'a4');
                const imgData = canvas.toDataURL('image/png');
                
                // Configuración de márgenes (15mm)
                const margin = 15;
                const pdfWidth = pdf.internal.pageSize.getWidth() - (margin * 2);
                const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                
                pdf.addImage(imgData, 'PNG', margin, margin, pdfWidth, pdfHeight);
                
                const start = document.getElementById('report-start').value;
                const end = document.getElementById('report-end').value;
                const fileName = `Reporte_Cargos_${start}_al_${end}.pdf`;
                
                const pdfBlob = pdf.output('blob');
                const file = new File([pdfBlob], fileName, { type: 'application/pdf' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            title: 'Reporte de Cargos',
                            text: 'Adjunto el reporte de cargos generado.',
                            files: [file]
                        });
                        msg.textContent = "Reporte compartido con éxito.";
                    } catch (error) {
                        console.error('Error al compartir:', error);
                        msg.textContent = "Se canceló o hubo un error al compartir.";
                    }
                } else {
                    msg.textContent = "Tu navegador no soporta compartir archivos directamente. Descargando...";
                    pdf.save(fileName);
                }
            });
        }, 500);
    }

    // --- UTILIDADES CANVAS ---
    function initCanvas(idSuffix) {
        const canvas = document.getElementById(`canvas-${idSuffix}`); 
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        canvas.width = canvas.offsetWidth * dpr; 
        canvas.height = canvas.offsetHeight * dpr;
        ctx.scale(dpr, dpr);
        ctx.strokeStyle = '#000000'; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 3;
        
        let isDrawing = false; let lastX = 0; let lastY = 0;
        
        function getPos(e) { 
            const rect = canvas.getBoundingClientRect(); 
            return { 
                x: (e.clientX || e.touches[0].clientX) - rect.left, 
                y: (e.clientY || e.touches[0].clientY) - rect.top 
            }; 
        }
        
        function start(e) { e.preventDefault(); isDrawing = true; const pos = getPos(e); [lastX, lastY] = [pos.x, pos.y]; }
        function draw(e) {
            if (!isDrawing) return; e.preventDefault();
            const pos = getPos(e);
            ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(pos.x, pos.y); ctx.stroke();
            [lastX, lastY] = [pos.x, pos.y];
        }
        function stop() { isDrawing = false; }

        canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stop); canvas.addEventListener('mouseout', stop);
        canvas.addEventListener('touchstart', start); canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stop); canvas.addEventListener('touchcancel', stop);
    }

    function clearCanvas(idSuffix) { 
        const canvas = document.getElementById(`canvas-${idSuffix}`); 
        if (canvas) { 
            const ctx = canvas.getContext('2d'); 
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
        } 
    }

    function isCanvasBlank(canvas) {
        const blank = document.createElement('canvas');
        blank.width = canvas.width; blank.height = canvas.height;
        return canvas.toDataURL() === blank.toDataURL();
    }

    function dataURLtoBlob(dataurl) {
        const arr = dataurl.split(','); const mime = arr[0].match(/:(.*?);/)[1];
        const bstr = atob(arr[1]); let n = bstr.length; const u8arr = new Uint8Array(n);
        while (n--) u8arr[n] = bstr.charCodeAt(n);
        return new Blob([u8arr], {type: mime});
    }
</script>
