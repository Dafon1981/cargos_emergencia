<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Firmas y Cargos v3.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html { height: 100%; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100%; padding: 20px; }
        .container { width: 100%; max-width: 960px; margin: 0 auto; padding: 1rem; }
        h1, h2, h3, h4 { color: #d4af37; margin-bottom: 1rem; }
        .card { background: #1a1a1a; border-radius: 12px; padding: 2.5rem; box-shadow: 0 8px 30px rgba(0,0,0,0.6 ); margin: 1.5rem 0; }
        input, textarea, select { width: 100%; padding: 12px; margin: 10px 0; background: #2a2a2a; border: 1px solid #444; border-radius: 6px; color: #e0e0e0; font-size: 1rem; }
        
        /* Botones Personalizados */
        button { padding: 14px 28px; margin: 8px 4px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1rem; transition: all 0.2s; flex-grow: 1; max-width: 300px; border: none; }
        button:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-green { background: #28a745; color: white; }
        .btn-yellow { background: #ffc107; color: black; }
        .btn-blue { background: #007bff; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        
        .buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; width: 100%; }
        .hidden { display: none !important; }
        .flex-center { display: flex; justify-content: center; align-items: center; flex-direction: column; }
        #mensaje { margin-top: 1rem; font-weight: bold; }
        
        /* Canvas de Firma */
        canvas { border: 2px solid #444; background: #f8f8f8; border-radius: 8px; margin: 12px 0; touch-action: none; width: 100%; max-width: 500px; height: 280px; box-shadow: inset 0 2px 6px rgba(0,0,0,0.1); }
        
        /* Lista de Cargos */
        .cargo-list { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .cargo-item { padding: 15px 20px; border-radius: 8px; cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; }
        .cargo-item:hover { filter: brightness(1.2); }
        .status-inconcluso { border-left: 6px solid #dc3545; }
        .status-completado { border-left: 6px solid #28a745; }
        .cargo-title { font-weight: bold; font-size: 1.1rem; }
        .cargo-meta { font-size: 0.9rem; color: #aaa; }
        .cargo-badge { padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .badge-red { background: rgba(220, 53, 69, 0.2); color: #ff6b6b; }
        .badge-green { background: rgba(40, 167, 69, 0.2); color: #51cf66; }

        /* Vista de Cargo */
        .signatures-display { display: flex; justify-content: space-around; align-items: center; text-align: center; margin-top: 2rem; flex-wrap: wrap; gap: 20px; }
        .signature-box { border: 1px solid #333; padding: 15px; border-radius: 8px; width: 250px; background: #222; }
        .signature-box h5 { color: #aaa; margin-bottom: 10px; }
        .signature-box img { max-height: 100px; width: auto; background-color: white; padding: 5px; border-radius: 4px; margin-top: 5px; }
        .signature-box p { color: #ff6b6b; font-style: italic; font-weight: bold; }
        .cargo-text-display { background: #222; padding: 20px; border-radius: 8px; border: 1px solid #444; white-space: pre-wrap; margin-bottom: 20px; font-size: 1.1rem; line-height: 1.6; }

        /* Filtros */
        .filter-controls { display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; margin-bottom: 20px; background: #222; padding: 15px; border-radius: 8px; }
        .filter-controls > div { flex-grow: 1; min-width: 200px; }
        .filter-controls label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #aaa; }
    </style>
</head>
<body>

<div class="container">
    <!-- Login Section -->
    <div id="login-section" class="card flex-center">
        <h1>Iniciar Sesión</h1>
        <form id="login-form" style="width:100%; max-width:420px;">
            <label>Usuario</label>
            <input type="text" id="usuario" required placeholder="Ej: Manuel">
            <label>Contraseña</label>
            <input type="password" id="clave" required>
            <div class="buttons"><button type="button" class="btn-blue" onclick="handleLogin()">Entrar</button></div>
            <div id="mensaje" style="color: #ff9800; text-align: center;"></div>
        </form>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard" class="hidden">
        <div class="card flex-center">
            <h1>Bienvenido, <span id="username" style="color:#d4af37;"></span></h1>
            <div class="buttons">
                <button class="btn-green" onclick="showCreateCargo()">Nuevo Cargo</button>
                <button class="btn-yellow" onclick="showSearch()">Búsqueda</button>
                <button class="btn-blue" onclick="showReport()">Reporte</button>
                <button class="btn-danger" onclick="handleLogout()">Cerrar Sesión</button>
            </div>
        </div>
        
        <!-- Lista Principal de Cargos -->
        <div id="main-cargo-list" class="card">
            <h2>Mis Cargos Recientes</h2>
            <div id="dashboard-results" class="cargo-list">Cargando...</div>
        </div>
    </div>

    <!-- Sección: Crear Nuevo Cargo -->
    <div id="create-cargo-section" class="hidden">
        <div class="card">
            <h2>Redactar Nuevo Cargo</h2>
            <label>Detalle del Cargo:</label>
            <textarea id="nuevo-cargo-texto" rows="8" placeholder="Escriba aquí el contenido del cargo..."></textarea>
            
            <label>Seleccionar Receptor (Quien debe firmar):</label>
            <select id="nuevo-cargo-receptor">
                <option value="">Cargando usuarios...</option>
            </select>

            <div id="create-signature-area" class="hidden flex-center" style="margin-top: 20px; border-top: 1px solid #444; padding-top: 20px;">
                <h3>Tu Firma (Creador)</h3>
                <canvas id="canvas-creador"></canvas>
                <div class="buttons">
                    <button class="btn-secondary" onclick="clearCanvas('creador')">Limpiar Firma</button>
                    <button class="btn-green" onclick="saveNewCargo()">Firmar y Enviar</button>
                </div>
            </div>

            <div class="buttons" id="btn-siguiente-area" style="margin-top: 20px;">
                <button class="btn-blue" onclick="proceedToSign()">Siguiente</button>
                <button class="btn-secondary" onclick="backToDashboard()">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Sección: Ver/Firmar Cargo -->
    <div id="view-cargo-section" class="hidden">
        <div class="card">
            <h2 id="view-cargo-title">Detalle del Cargo</h2>
            <div class="cargo-text-display" id="view-cargo-texto"></div>
            
            <div class="signatures-display" id="view-signatures">
                <!-- Se llena por JS -->
            </div>

            <div id="receptor-signature-area" class="hidden flex-center" style="margin-top: 2rem; border-top: 1px solid #444; padding-top: 2rem;">
                <h3>Firma del Receptor</h3>
                <canvas id="canvas-receptor"></canvas>
                <div class="buttons">
                    <button class="btn-secondary" onclick="clearCanvas('receptor')">Limpiar Firma</button>
                    <button class="btn-green" onclick="signAsReceptor()">Firmar Cargo</button>
                </div>
            </div>

            <div class="buttons" style="margin-top: 2rem;">
                <button class="btn-danger hidden" id="btn-eliminar-cargo" onclick="deleteCargo()">Eliminar Cargo</button>
                <button class="btn-secondary" onclick="backToDashboard()">Volver</button>
            </div>
        </div>
    </div>

    <!-- Sección: Búsqueda / Reporte -->
    <div id="search-report-section" class="hidden">
        <div class="card">
            <h2 id="sr-title">Búsqueda de Cargos</h2>
            <div class="filter-controls">
                <div>
                    <label>Desde</label>
                    <input type="date" id="sr-desde">
                </div>
                <div>
                    <label>Hasta</label>
                    <input type="date" id="sr-hasta">
                </div>
                <div class="flex-center" style="flex-direction: row; gap: 10px;">
                    <button class="btn-yellow" onclick="executeSearch()">Buscar</button>
                    <button class="btn-blue hidden" id="btn-exportar-pdf" onclick="exportToPDF()">Exportar PDF</button>
                </div>
            </div>
            <div id="sr-results" class="cargo-list"></div>
        </div>
        <div class="buttons"><button class="btn-secondary" onclick="backToDashboard()">Volver al Inicio</button></div>
    </div>

</div>
<script>
    const SUPABASE_URL = 'https://esiklpxyectbekxvajnw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzaWtscHh5ZWN0YmVreHZham53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE2OTI1MjEsImV4cCI6MjA3NzI2ODUyMX0.mtQnqUrTmhmN1DQxOAUnGpizhYZobStHDH0cz_XfKGU';
    
    let supabaseClient = null;
    let currentUser = null;
    let currentCargoId = null; // Para saber qué cargo estamos viendo/editando
    let currentMode = 'dashboard'; // 'dashboard', 'search', 'report'

    function getSupabase( ) {
        if (supabaseClient) return supabaseClient;
        try { supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); return supabaseClient; } 
        catch (err) { console.error("Error inicializando Supabase:", err); return null; }
    }

    window.onload = () => {
        const stored = localStorage.getItem('currentUser');
        if (stored) {
            try { currentUser = JSON.parse(stored); showDashboard(); } 
            catch (e) { localStorage.removeItem('currentUser'); showLogin(); }
        } else { showLogin(); }
    };

    // --- NAVEGACIÓN Y LOGIN ---
    function showLogin() {
        document.getElementById('login-section').classList.remove('hidden');
        document.getElementById('dashboard').classList.add('hidden');
        document.getElementById('create-cargo-section').classList.add('hidden');
        document.getElementById('view-cargo-section').classList.add('hidden');
        document.getElementById('search-report-section').classList.add('hidden');
    }

    async function handleLogin() {
        const supabase = getSupabase(); if (!supabase) return;
        const usuario = document.getElementById('usuario').value.trim();
        const clave = document.getElementById('clave').value;
        const mensaje = document.getElementById('mensaje');
        mensaje.textContent = 'Verificando...';
        
        if (!usuario || !clave) { mensaje.textContent = 'Ingresa usuario y contraseña'; return; }
        
        try {
            const { data, error } = await supabase.from('usuarios').select('id, usuario').eq('usuario', usuario).eq('clave', clave).single();
            if (error || !data) { mensaje.textContent = 'Usuario o contraseña incorrectos.'; return; }
            currentUser = data;
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            mensaje.textContent = '¡Login exitoso!';
            setTimeout(showDashboard, 800);
        } catch (err) { mensaje.textContent = 'Error inesperado.'; }
    }

    function handleLogout() {
        currentUser = null;
        localStorage.removeItem('currentUser');
        showLogin();
    }

    function backToDashboard() {
        showDashboard();
    }

    function showDashboard() {
        currentMode = 'dashboard';
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('create-cargo-section').classList.add('hidden');
        document.getElementById('view-cargo-section').classList.add('hidden');
        document.getElementById('search-report-section').classList.add('hidden');
        
        document.getElementById('dashboard').classList.remove('hidden');
        document.getElementById('username').textContent = currentUser.usuario || 'Usuario';
        
        loadRecentCargos();
    }

    // --- CARGAR LISTA DE CARGOS (DASHBOARD) ---
    async function loadRecentCargos() {
        const supabase = getSupabase(); if (!supabase) return;
        const resultsContainer = document.getElementById('dashboard-results');
        resultsContainer.innerHTML = '<p>Cargando...</p>';

        // Buscar cargos donde el usuario es creador O receptor
        const { data, error } = await supabase
            .from('firmas_cargos')
            .select('*')
            .or(`created_by.eq.${currentUser.id},receptor_id.eq.${currentUser.id}`)
            .order('fecha', { ascending: false })
            .limit(20);

        if (error) { resultsContainer.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`; return; }
        if (!data || data.length === 0) { resultsContainer.innerHTML = '<p>No tienes cargos recientes.</p>'; return; }

        renderCargoList(data, resultsContainer);
    }

    function renderCargoList(cargos, container) {
        container.innerHTML = '';
        cargos.forEach(cargo => {
            const isCompletado = cargo.estatus === 'completado';
            const statusClass = isCompletado ? 'status-completado' : 'status-inconcluso';
            const badgeClass = isCompletado ? 'badge-green' : 'badge-red';
            const statusText = isCompletado ? 'Completado' : 'Inconcluso';
            
            // Determinar el título a mostrar (resumen del texto)
            let titulo = cargo.observacion ? cargo.observacion.substring(0, 50) : 'Cargo sin texto';
            if (cargo.observacion && cargo.observacion.length > 50) titulo += '...';

            const fecha = new Date(cargo.fecha).toLocaleDateString('es-ES');
            
            let rolText = '';
            if (cargo.created_by === currentUser.id) rolText = `Enviado a: ${cargo.nombre_receptor}`;
            else rolText = `Recibido de: ${cargo.responsable}`;

            const div = document.createElement('div');
            div.className = `cargo-item ${statusClass}`;
            div.onclick = () => openCargoView(cargo);
            div.innerHTML = `
                <div>
                    <div class="cargo-title">${titulo}</div>
                    <div class="cargo-meta">${fecha} | ${rolText}</div>
                </div>
                <div class="cargo-badge ${badgeClass}">${statusText}</div>
            `;
            container.appendChild(div);
        });
    }

    // --- CREAR NUEVO CARGO ---
    async function showCreateCargo() {
        document.getElementById('dashboard').classList.add('hidden');
        document.getElementById('create-cargo-section').classList.remove('hidden');
        
        document.getElementById('nuevo-cargo-texto').value = '';
        document.getElementById('btn-siguiente-area').classList.remove('hidden');
        document.getElementById('create-signature-area').classList.add('hidden');
        
        await loadUsersForSelect();
    }

    async function loadUsersForSelect() {
        const supabase = getSupabase(); if (!supabase) return;
        const select = document.getElementById('nuevo-cargo-receptor');
        select.innerHTML = '<option value="">Cargando...</option>';
        
        const { data, error } = await supabase.from('usuarios').select('id, usuario').neq('id', currentUser.id).order('usuario');
        
        if (error) { select.innerHTML = '<option value="">Error al cargar</option>'; return; }
        
        select.innerHTML = '<option value="">-- Seleccione un receptor --</option>';
        data.forEach(u => {
            const opt = document.createElement('option');
            opt.value = u.id;
            opt.textContent = u.usuario;
            select.appendChild(opt);
        });
    }

    function proceedToSign() {
        const texto = document.getElementById('nuevo-cargo-texto').value.trim();
        const receptorId = document.getElementById('nuevo-cargo-receptor').value;
        
        if (!texto) { alert("Debe escribir el detalle del cargo."); return; }
        if (!receptorId) { alert("Debe seleccionar un receptor."); return; }
        
        document.getElementById('btn-siguiente-area').classList.add('hidden');
        document.getElementById('create-signature-area').classList.remove('hidden');
        setTimeout(() => initCanvas('creador'), 150);
    }

    async function saveNewCargo() {
        const supabase = getSupabase(); if (!supabase) return;
        const canvas = document.getElementById('canvas-creador');
        
        // Verificar si el canvas está en blanco (lógica simple: si no se ha dibujado, no guardar)
        // Nota: Una validación perfecta de canvas en blanco es compleja, asumimos que el usuario firmó si hizo clic.
        
        const texto = document.getElementById('nuevo-cargo-texto').value.trim();
        const receptorSelect = document.getElementById('nuevo-cargo-receptor');
        const receptorId = receptorSelect.value;
        const receptorNombre = receptorSelect.options[receptorSelect.selectedIndex].text;
        
        // Subir firma del creador
        const dataURL = canvas.toDataURL('image/png'); 
        const blob = dataURLtoBlob(dataURL);
        const fileName = `cargo_${Date.now()}_creador.png`;
        
        const { error: uploadErr } = await supabase.storage.from('firma_cargos').upload(fileName, blob, { contentType: 'image/png' });
        if (uploadErr) { alert('Error al subir firma: ' + uploadErr.message); return; }
        
        const { data: urlData } = supabase.storage.from('firma_cargos').getPublicUrl(fileName);
        const firmaCreadorUrl = urlData.publicUrl;

        // Guardar en base de datos
        // Usamos la columna 'observacion' para guardar el texto del cargo para mantener compatibilidad con tu tabla
        const { error } = await supabase.from('firmas_cargos').insert([{
            observacion: texto,
            created_by: currentUser.id,
            responsable: currentUser.usuario, // Nombre del creador
            firma_recepcion_url: firmaCreadorUrl, // Usamos esto como firma del creador
            receptor_id: receptorId, // Necesitarás crear esta columna en tu tabla si no existe
            nombre_receptor: receptorNombre,
            estatus: 'inconcluso',
            tipo_documento: 'Cargo Personalizado' // Valor por defecto
        }]);

        if (error) { alert('Error al guardar el cargo: ' + error.message); return; }
        
        alert('Cargo creado y enviado exitosamente.');
        backToDashboard();
    }

    // --- VER Y FIRMAR CARGO EXISTENTE ---
    async function openCargoView(cargo) {
        currentCargoId = cargo.id;
        document.getElementById('dashboard').classList.add('hidden');
        document.getElementById('search-report-section').classList.add('hidden');
        document.getElementById('view-cargo-section').classList.remove('hidden');
        
        document.getElementById('view-cargo-texto').textContent = cargo.observacion || 'Sin contenido';
        
        const sigContainer = document.getElementById('view-signatures');
        sigContainer.innerHTML = `
            <div class="signature-box">
                <h5>Creado por:</h5>
                <div style="color:#d4af37; font-weight:bold;">${cargo.responsable}</div>
                ${cargo.firma_recepcion_url ? `<img src="${cargo.firma_recepcion_url}?t=${new Date().getTime()}" crossorigin="anonymous">` : '<p>Sin firma</p>'}
            </div>
            <div class="signature-box">
                <h5>Receptor:</h5>
                <div style="color:#d4af37; font-weight:bold;">${cargo.nombre_receptor || 'Desconocido'}</div>
                ${cargo.firma_receptor_url ? `<img src="${cargo.firma_receptor_url}?t=${new Date().getTime()}" crossorigin="anonymous">` : '<p>Falta Firma</p>'}
            </div>
        `;

        const receptorArea = document.getElementById('receptor-signature-area');
        const btnEliminar = document.getElementById('btn-eliminar-cargo');
        
        receptorArea.classList.add('hidden');
        btnEliminar.classList.add('hidden');

        // Lógica de permisos
        const isCreator = cargo.created_by === currentUser.id;
        const isReceptor = cargo.receptor_id == currentUser.id; // Usamos == por si uno es string y otro int
        const isCompleted = cargo.estatus === 'completado';

        if (isCreator && !isCompleted) {
            btnEliminar.classList.remove('hidden');
        }

        if (isReceptor && !isCompleted) {
            receptorArea.classList.remove('hidden');
            setTimeout(() => initCanvas('receptor'), 150);
        }
    }

    async function signAsReceptor() {
        const supabase = getSupabase(); if (!supabase) return;
        const canvas = document.getElementById('canvas-receptor');
        
        const dataURL = canvas.toDataURL('image/png'); 
        const blob = dataURLtoBlob(dataURL);
        const fileName = `cargo_${currentCargoId}_receptor_${Date.now()}.png`;
        
        const { error: uploadErr } = await supabase.storage.from('firma_cargos').upload(fileName, blob, { contentType: 'image/png' });
        if (uploadErr) { alert('Error al subir firma: ' + uploadErr.message); return; }
        
        const { data: urlData } = supabase.storage.from('firma_cargos').getPublicUrl(fileName);
        const firmaReceptorUrl = urlData.publicUrl;

        const { error } = await supabase.from('firmas_cargos').update({
            firma_receptor_url: firmaReceptorUrl,
            estatus: 'completado'
        }).eq('id', currentCargoId);

        if (error) { alert('Error al guardar firma: ' + error.message); return; }
        
        alert('Cargo firmado exitosamente.');
        backToDashboard();
    }

    async function deleteCargo() {
        if (!confirm("¿Estás seguro de que deseas eliminar este cargo? Esta acción no se puede deshacer.")) return;
        
        const supabase = getSupabase(); if (!supabase) return;
        const { error } = await supabase.from('firmas_cargos').delete().eq('id', currentCargoId);
        
        if (error) { alert('Error al eliminar: ' + error.message); return; }
        
        alert('Cargo eliminado.');
        backToDashboard();
    }

    // --- BÚSQUEDA Y REPORTE ---
    function showSearch() {
        currentMode = 'search';
        document.getElementById('dashboard').classList.add('hidden');
        document.getElementById('search-report-section').classList.remove('hidden');
        document.getElementById('sr-title').textContent = 'Búsqueda de Cargos';
        document.getElementById('btn-buscar').classList.remove('hidden');
        document.getElementById('btn-exportar-pdf').classList.add('hidden');
        document.getElementById('sr-results').innerHTML = '';
    }

    function showReport() {
        currentMode = 'report';
        document.getElementById('dashboard').classList.add('hidden');
        document.getElementById('search-report-section').classList.remove('hidden');
        document.getElementById('sr-title').textContent = 'Reporte de Cargos';
        document.getElementById('btn-buscar').classList.remove('hidden');
        document.getElementById('btn-exportar-pdf').classList.remove('hidden');
        document.getElementById('sr-results').innerHTML = '';
    }

    async function executeSearch() {
        const supabase = getSupabase(); if (!supabase) return;
        const resultsContainer = document.getElementById('sr-results');
        resultsContainer.innerHTML = '<p>Buscando...</p>';

        const fechaInicioStr = document.getElementById('sr-desde').value;
        const fechaFinStr = document.getElementById('sr-hasta').value;

        let query = supabase.from('firmas_cargos').select('*').order('fecha', { ascending: false });

        // Filtro de fechas
        if (fechaInicioStr) {
            const start = new Date(fechaInicioStr); start.setUTCHours(0,0,0,0);
            query = query.gte('fecha', start.toISOString());
        }
        if (fechaFinStr) {
            const end = new Date(fechaFinStr); end.setUTCHours(23,59,59,999);
            query = query.lte('fecha', end.toISOString());
        }

        const { data, error } = await query;

        if (error) { resultsContainer.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`; return; }
        if (!data || data.length === 0) { resultsContainer.innerHTML = '<p>No se encontraron cargos en este rango de fechas.</p>'; return; }

        renderCargoList(data, resultsContainer);
    }

    // --- EXPORTAR A PDF ---
    async function exportToPDF() {
        const resultsContainer = document.getElementById('sr-results');
        if (resultsContainer.children.length === 0 || resultsContainer.innerHTML.includes('No se encontraron')) {
            alert("Primero debe realizar una búsqueda con resultados para exportar.");
            return;
        }

        // Obtener los datos de nuevo basados en las fechas para generar el PDF
        const supabase = getSupabase(); if (!supabase) return;
        const fechaInicioStr = document.getElementById('sr-desde').value;
        const fechaFinStr = document.getElementById('sr-hasta').value;

        let query = supabase.from('firmas_cargos').select('*').order('fecha', { ascending: false });
        if (fechaInicioStr) query = query.gte('fecha', new Date(fechaInicioStr).toISOString());
        if (fechaFinStr) query = query.lte('fecha', new Date(fechaFinStr).toISOString());

        const { data, error } = await query;
        if (error || !data || data.length === 0) return;

        const pdfContainer = document.getElementById('pdf-container');
        pdfContainer.innerHTML = '<h1 style="text-align:center; margin-bottom: 20px;">Reporte de Cargos</h1>';

        data.forEach((cargo, index) => {
            const fecha = new Date(cargo.fecha).toLocaleDateString('es-ES');
            const html = `
                <div class="pdf-cargo">
                    <h3>Cargo #${index + 1} - Fecha: ${fecha}</h3>
                    <p><strong>Estado:</strong> ${cargo.estatus.toUpperCase()}</p>
                    <div style="margin: 15px 0; padding: 10px; background: #f9f9f9; border: 1px solid #ddd;">
                        ${cargo.observacion || 'Sin contenido'}
                    </div>
                    <div class="pdf-signatures">
                        <div class="pdf-sig-box">
                            ${cargo.firma_recepcion_url ? `<img src="${cargo.firma_recepcion_url}?t=${new Date().getTime()}" crossorigin="anonymous">` : '<p>Sin firma</p>'}
                            <p><strong>Creador:</strong> ${cargo.responsable}</p>
                        </div>
                        <div class="pdf-sig-box">
                            ${cargo.firma_receptor_url ? `<img src="${cargo.firma_receptor_url}?t=${new Date().getTime()}" crossorigin="anonymous">` : '<p>Sin firma</p>'}
                            <p><strong>Receptor:</strong> ${cargo.nombre_receptor || 'N/A'}</p>
                        </div>
                    </div>
                </div>
            `;
            pdfContainer.innerHTML += html;
        });

        pdfContainer.style.display = 'block'; // Mostrar temporalmente para renderizar

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        
        try {
            const canvas = await html2canvas(pdfContainer, { scale: 2, useCORS: true });
            const imgData = canvas.toDataURL('image/png');
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
            
            pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
            pdf.save('Reporte_Cargos.pdf');
        } catch (err) {
            console.error("Error generando PDF:", err);
            alert("Hubo un problema al generar el PDF.");
        } finally {
            pdfContainer.style.display = 'none'; // Ocultar de nuevo
            pdfContainer.innerHTML = '';
        }
    }

    // --- UTILIDADES CANVAS ---
    function initCanvas(idx) {
        const canvas = document.getElementById(`canvas-${idx}`); if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        canvas.width = canvas.offsetWidth * dpr; canvas.height = canvas.offsetHeight * dpr;
        ctx.scale(dpr, dpr);
        ctx.strokeStyle = '#000000'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        let isDrawing = false; let lastX = 0; let lastY = 0; let lastTime = 0; let lastLineWidth = 3.5;
        function getPosition(e) { const rect = canvas.getBoundingClientRect(); return { x: (e.clientX || e.touches[0].clientX) - rect.left, y: (e.clientY || e.touches[0].clientY) - rect.top }; }
        function draw(e) {
            if (!isDrawing) return; e.preventDefault();
            const pos = getPosition(e); const currentTime = Date.now(); const timeDiff = currentTime - lastTime || 1;
            const distance = Math.sqrt(Math.pow(pos.x - lastX, 2) + Math.pow(pos.y - lastY, 2));
            const velocity = distance / timeDiff;
            const lineWidth = Math.max(2.5, Math.min(7.0, 7.0 - velocity * 1.5));
            ctx.lineWidth = (lineWidth + lastLineWidth) / 2;
            ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(pos.x, pos.y); ctx.stroke();
            [lastX, lastY, lastTime, lastLineWidth] = [pos.x, pos.y, currentTime, lineWidth];
        }
        function startDrawing(e) {
            e.preventDefault(); isDrawing = true; const pos = getPosition(e);
            [lastX, lastY] = [pos.x, pos.y]; lastTime = Date.now(); lastLineWidth = 3.5;
            ctx.beginPath(); ctx.arc(pos.x, pos.y, lastLineWidth / 2, 0, Math.PI * 2); ctx.fillStyle = '#000000'; ctx.fill();
        }
        function stopDrawing() { isDrawing = false; ctx.beginPath(); }
        canvas.addEventListener('mousedown', startDrawing); canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing); canvas.addEventListener('mouseout', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing); canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing); canvas.addEventListener('touchcancel', stopDrawing);
    }

    function clearCanvas(idx) { const canvas = document.getElementById(`canvas-${idx}`); if (canvas) { const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, canvas.width, canvas.height); } }

    function dataURLtoBlob(dataurl) {
        const arr = dataurl.split(',');
        const mime = arr[0].match(/:(.*?);/)[1];
        const bstr = atob(arr[1]);
        let n = bstr.length;
        const u8arr = new Uint8Array(n);
        while (n--) u8arr[n] = bstr.charCodeAt(n);
        return new Blob([u8arr], {type: mime});
    }
</script>
